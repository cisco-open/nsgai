#
# Builds and runs the full privileged test suite (see
# scripts/run-container-tests.sh) inside each supported distro image
# under docker/Dockerfile.<platform>, on both amd64 and arm64. This is
# the release-facing platform-support matrix; see docker/README.md for
# the platform list.
#
# arm64 jobs use GitHub-hosted arm64 Linux runners (`ubuntu-24.04-arm`),
# available free for public repos. If your org only has amd64 runners
# available (e.g. GHE without hosted arm64 capacity), replace that label
# with a self-hosted arm64 runner label instead.

name: docker-platform-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-build-test:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - fedora
          - ubuntu22.04
          - ubuntu24.04
          - ubuntu26.04
          - debian12
          - debian13
          - rockylinux9
        arch:
          - amd64
          - arm64

    env:
      NSGAI_CONTAINER_RUNTIME: docker

    steps:
      - uses: actions/checkout@v7

      - name: Build image and run full test suite (${{ matrix.platform }}/${{ matrix.arch }})
        run: |
          bash scripts/run-container-tests.sh --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}" --rebuild

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}-${{ matrix.arch }}
          path: build-container-${{ matrix.platform }}-${{ matrix.arch }}/coverage/html
          if-no-files-found: ignore

